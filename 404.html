<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — L'Héritage d'un savoir-faire</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3a4c34">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#f6eddb; --card:#fffaf0; --ink:#3b2a19; --ink-2:#6c5238;
    --wood:#b26a33; --forest:#4c6144; --forest-2:#3a4c34; --honey:#d9a43c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1.2rem; background:var(--paper); color:var(--ink);
    font-family:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.6;
  }
  .box{
    max-width:30rem; text-align:center; background:var(--card);
    border:2px solid var(--ink); border-radius:255px 12px 235px 14px/14px 225px 16px 255px;
    box-shadow:6px 6px 0 var(--forest-2); padding:2.6rem 2rem;
  }
  .k{ font-family:"Caveat", cursive; font-size:1.7rem; color:var(--wood); margin:0 0 .3rem; transform:rotate(-2deg); }
  h1{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.9rem; line-height:1.15; margin:0 0 .8rem; }
  p{ color:var(--ink-2); margin:0 0 1.6rem; }
  a.btn{
    display:inline-block; font-family:"Fraunces", Georgia, serif; font-weight:600;
    background:var(--wood); color:#fff; text-decoration:none;
    padding:.75rem 1.5rem; border:2px solid var(--ink); border-radius:255px 12px 235px 14px/14px 225px 16px 255px;
    box-shadow:4px 4px 0 var(--ink);
  }
  a.btn:focus-visible{ outline:3px solid var(--forest-2); outline-offset:2px; }
</style>
</head>
<body>
  <main class="box">
    <p class="k">Oups…</p>
    <h1>Cette page a filé par la lucarne</h1>
    <p>Le lien est peut-être ancien ou mal recopié. Revenons sur la terre ferme.</p>
    <a class="btn" href="/">Retour à l'accueil</a>
  </main>
</body>
</html>

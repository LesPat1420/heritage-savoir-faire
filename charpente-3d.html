<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charpente 3D — démo</title>
<style>
  :root{ --cream:#f3ebdd; --ink:#2e2013; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:radial-gradient(120% 80% at 50% 15%, #f7f1e6 0%, var(--cream) 55%, #e9ddc6 100%);
    font:15px/1.5 "EB Garamond",Georgia,serif; color:var(--ink);
    display:flex; flex-direction:column; min-height:100%;
  }
  header{ padding:1.2rem 1.4rem .4rem; text-align:center; }
  header h1{ font-family:"Cinzel","EB Garamond",serif; font-weight:500; font-size:1.15rem; letter-spacing:.02em; margin:0; }
  header p{ margin:.2rem 0 0; color:#6b5a44; font-size:.86rem; }
  #scene{ flex:1; width:100%; min-height:340px; cursor:grab; }
  #scene:active{ cursor:grabbing; }
  footer{ text-align:center; padding:.5rem 1rem 1rem; color:#8a7862; font-size:.8rem; }
  .fallback{ display:none; padding:2rem; text-align:center; color:#8a7862; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=EB+Garamond&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Ferme de charpente traditionnelle</h1>
  <p>Glissez pour faire tourner · molette pour approcher</p>
</header>

<canvas id="scene"></canvas>
<noscript><p class="fallback" style="display:block">Activez JavaScript pour voir la charpente en 3D.</p></noscript>

<footer>Démo — à intégrer dans l'en-tête de la version retenue</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/js/charpente3d.js"></script>
<script>
  var c = document.getElementById('scene');
  if (!window.Charpente3D || !window.Charpente3D.create(c, { interactive: true, wheelZoom: true })) {
    document.querySelector('.fallback').style.display = 'block';
  }
</script>
</body>
</html>

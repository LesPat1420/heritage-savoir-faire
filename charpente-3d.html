<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charpente 3D — démo</title>
<style>
  :root{ --cream:#f3ebdd; --ink:#2e2013; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:
      radial-gradient(120% 80% at 50% 15%, #f7f1e6 0%, var(--cream) 55%, #e9ddc6 100%);
    font:15px/1.5 "EB Garamond",Georgia,serif; color:var(--ink);
    display:flex; flex-direction:column; min-height:100%;
  }
  header{ padding:1.2rem 1.4rem .4rem; text-align:center; }
  header h1{ font-family:"Cinzel","EB Garamond",serif; font-weight:500; font-size:1.15rem; letter-spacing:.02em; margin:0; }
  header p{ margin:.2rem 0 0; color:#6b5a44; font-size:.86rem; }
  #scene{ flex:1; width:100%; min-height:340px; touch-action:none; cursor:grab; }
  #scene:active{ cursor:grabbing; }
  footer{ text-align:center; padding:.5rem 1rem 1rem; color:#8a7862; font-size:.8rem; }
  .fallback{ display:none; padding:2rem; text-align:center; color:#8a7862; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=EB+Garamond&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>Ferme de charpente traditionnelle</h1>
  <p>Glissez pour faire tourner · molette pour approcher</p>
</header>

<canvas id="scene"></canvas>
<noscript><p class="fallback" style="display:block">Activez JavaScript pour voir la charpente en 3D.</p></noscript>

<footer>Démo — à intégrer dans l'en-tête de la version retenue</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('scene');
  if (!window.THREE) { document.querySelector('.fallback').style.display = 'block'; return; }

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  let camDist = 15, camPhi = 1.15, camTheta = 0.7;

  // ---- Lumières ----
  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6b5a44, 0.85));
  const sun = new THREE.DirectionalLight(0xffe8c4, 1.15);
  sun.position.set(7, 12, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
  sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
  scene.add(sun);

  // ---- Sol (reçoit l'ombre uniquement) ----
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.ShadowMaterial({ opacity: 0.16 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.02;
  ground.receiveShadow = true;
  scene.add(ground);

  // ---- Bois ----
  const woodLight = new THREE.MeshStandardMaterial({ color: 0xb07b42, roughness: 0.82, metalness: 0.02 });
  const woodDark  = new THREE.MeshStandardMaterial({ color: 0x8a5a2c, roughness: 0.85, metalness: 0.02 });

  const truss = new THREE.Group();

  // Pièce de bois : longueur suivant l'axe X local, section h×d
  function beam(len, h, d, mat) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, d), mat || woodLight);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  // Place une pièce entre deux points 2D (plan XY), épaisseur en Z gérée par 'd'
  function member(group, x1, y1, x2, y2, h, d, mat) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    const b = beam(len, h, d, mat);
    b.position.set((x1 + x2) / 2, (y1 + y2) / 2, 0);
    b.rotation.z = Math.atan2(dy, dx);
    group.add(b);
    return b;
  }

  // ---- Géométrie d'une ferme ----
  const SPAN = 8, HALF = SPAN / 2, RISE = 3.1, FOOT = 0;
  function makeFerme(z) {
    const f = new THREE.Group();
    // Entrait (tie-beam)
    member(f, -HALF, FOOT, HALF, FOOT, 0.42, 0.34, woodDark);
    // Arbalétriers (principal rafters)
    member(f, -HALF, FOOT, 0, RISE, 0.38, 0.3);
    member(f,  HALF, FOOT, 0, RISE, 0.38, 0.3);
    // Poinçon (king post)
    member(f, 0, FOOT, 0, RISE, 0.34, 0.34, woodDark);
    // Contrefiches (struts)
    member(f, 0, RISE * 0.42, -HALF * 0.52, RISE * 0.52, 0.26, 0.24);
    member(f, 0, RISE * 0.42,  HALF * 0.52, RISE * 0.52, 0.26, 0.24);
    // Aisseliers bas (petits jambages)
    member(f, 0, RISE * 0.42, -HALF * 0.22, FOOT + 0.9, 0.2, 0.22);
    member(f, 0, RISE * 0.42,  HALF * 0.22, FOOT + 0.9, 0.2, 0.22);
    f.position.z = z;
    return f;
  }

  const Z = [-3, 0, 3];
  Z.forEach((z) => truss.add(makeFerme(z)));

  // ---- Pièces longitudinales (suivant Z) ----
  const spanZ = Z[Z.length - 1] - Z[0] + 1.2;
  function longBeam(x, y, h, d, mat) {
    const m = beam(spanZ, h, d, mat);
    m.rotation.y = Math.PI / 2;      // aligne la longueur sur Z
    m.position.set(x, y, 0);
    truss.add(m);
  }
  // Sablières (wall plates)
  longBeam(-HALF, FOOT, 0.3, 0.3, woodDark);
  longBeam( HALF, FOOT, 0.3, 0.3, woodDark);
  // Faîtière (ridge)
  longBeam(0, RISE - 0.02, 0.26, 0.26, woodDark);
  // Pannes (purlins) sur chaque versant
  for (const t of [0.5]) {
    const px = -HALF * (1 - t), py = FOOT + RISE * t;
    longBeam(px, py + 0.15, 0.22, 0.22);
    longBeam(-px, py + 0.15, 0.22, 0.22);
  }

  // ---- Chevrons ----
  const chevMat = new THREE.MeshStandardMaterial({ color: 0xc08a4e, roughness: 0.8 });
  const slopeLen = Math.hypot(HALF, RISE);
  const overhang = 0.7;                     // débord de toit à l'égout
  const nChev = 8;
  for (const s of [-1, 1]) {
    // direction du faîte vers l'égout
    const dx = (s * HALF) / slopeLen, dy = -RISE / slopeLen;
    const nx = -dy, ny = dx;                // normale (vers l'extérieur/haut)
    const L = slopeLen + overhang;
    const cx = 0 + dx * (L / 2) + nx * 0.16;
    const cy = RISE + dy * (L / 2) + ny * 0.16;
    for (let i = 0; i < nChev; i++) {
      const cz = Z[0] - 0.4 + (i / (nChev - 1)) * (spanZ - 0.4);
      const c = beam(L, 0.12, 0.15, chevMat);
      c.position.set(cx, cy, cz);
      c.rotation.z = Math.atan2(dy, dx);
      c.castShadow = true;
      truss.add(c);
    }
  }

  // Centre le tout un peu au-dessus du sol
  truss.position.y = 0.0;
  scene.add(truss);

  // ---- Interaction ----
  let dragging = false, px = 0, py = 0, autol = true;
  canvas.addEventListener('pointerdown', (e) => { dragging = true; autol = false; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    camTheta -= (e.clientX - px) * 0.008;
    camPhi = Math.max(0.35, Math.min(1.5, camPhi - (e.clientY - py) * 0.006));
    px = e.clientX; py = e.clientY;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camDist = Math.max(8, Math.min(26, camDist + Math.sign(e.deltaY) * 1.1));
  }, { passive: false });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * devicePixelRatio || canvas.height !== h * devicePixelRatio) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick() {
    resize();
    if (autol && !reduce) camTheta += 0.0022;
    camera.position.set(
      camDist * Math.sin(camPhi) * Math.sin(camTheta),
      camDist * Math.cos(camPhi),
      camDist * Math.sin(camPhi) * Math.cos(camTheta)
    );
    camera.lookAt(0, RISE * 0.45, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
